name: CMake Windows Win32 Release

on:
  release:
    types: [published]
  workflow_dispatch:

# New repositories hand GITHUB_TOKEN read-only access by default, and uploading an asset to a
# release needs write. Without this the build succeeds and only the upload fails.
permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  build-windows-win32-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Latest Release Tag
        id: find_tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          releases-only: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure and build
        run: |
          $buildDir = "${{ github.workspace }}\build"
          cmake -S "${{ github.workspace }}" -B $buildDir -G "Visual Studio 17 2022" -A Win32 -T host=x64
          cmake --build $buildDir --config ${{ env.BUILD_TYPE }} -- /m

      # The zip has to stand on its own: a player who unzips it gets the patcher, both DLLs, both
      # addons, the install instructions, the licence and a way to verify the download.
      - name: Package release
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "${{ steps.find_tag.outputs.tag }}" }

          $root    = "${{ github.workspace }}"
          $staging = Join-Path $root "staging"

          Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $staging "Interface\AddOns") | Out-Null

          # binaries produced by this build
          Copy-Item (Join-Path $root "build\bin\Release\AwesomeWotlkPatch.exe") $staging
          Copy-Item (Join-Path $root "build\bin\Release\AwesomeWotlkLib.dll")   $staging
          Copy-Item (Join-Path $root "deps\skia\skia.dll")                      $staging

          # addons
          Copy-Item (Join-Path $root "addons\AwesomeCVar") (Join-Path $staging "Interface\AddOns") -Recurse
          Copy-Item (Join-Path $root "addons\Flash")       (Join-Path $staging "Interface\AddOns") -Recurse

          # install files only: the archive is for players, not for reading.
          # Documentation and the source stay in the repository.
          Copy-Item (Join-Path $root "release\INSTALL.txt") $staging

          # Licence texts must travel with the binaries: GPL-3.0 for the mod itself, and the
          # MIT/BSD/FTL notices for the libraries it links. Collapsed into one file so the
          # archive still holds nothing but install files.
          Copy-Item (Join-Path $root "LICENSE") $staging
          $notices = New-Object System.Collections.Generic.List[string]
          $notices.Add("THIRD-PARTY NOTICES")
          $notices.Add("===================")
          $notices.Add("")
          $notices.Add("AwesomeWotlkLib.dll links the components below. Several of their licences")
          $notices.Add("require the copyright notice to travel with the binary, so the full texts")
          $notices.Add("follow. The mod itself is GPL-3.0-or-later; see LICENSE.")
          $notices.Add("")
          foreach ($f in Get-ChildItem (Join-Path $root "licenses") -Filter *.txt | Sort-Object Name) {
            $notices.Add(("-" * 72))
            $notices.Add($f.BaseName)
            $notices.Add(("-" * 72))
            $notices.Add((Get-Content $f.FullName -Raw).TrimEnd())
            $notices.Add("")
          }
          $noticeText = ($notices -join "`n").TrimEnd() + "`n"
          [IO.File]::WriteAllText((Join-Path $staging "THIRD-PARTY-NOTICES.txt"), $noticeText, (New-Object System.Text.UTF8Encoding($false)))

          # checksums of everything that ships, written without a BOM so `sha256sum -c` accepts them
          $lines = Get-ChildItem $staging -Recurse -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              $rel = $_.FullName.Substring($staging.Length + 1).Replace('\', '/')
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $rel
            } |
            Sort-Object
          # LF, not CRLF: WriteAllLines uses Environment.NewLine, and a trailing CR makes every
          # entry fail `sha256sum -c` with "no such file".
          $text = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText((Join-Path $staging "SHA256SUMS.txt"), $text, (New-Object System.Text.UTF8Encoding($false)))

          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath (Join-Path $root "AwesomeWotLK_$tag.zip") -Force

      - name: Upload Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/AwesomeWotLK_*.zip
          tag_name: ${{ github.event.release.tag_name || steps.find_tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
